<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="photo/header/logo.svg" alt="logo">
            <p>Book Store</p>
        </div>
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">About us</a>
            <a href="#">Courses</a>
            <a href="#">Our Service</a>
            <a href="#">Contact us</a>
            <button class="btn-logo" type="submit">Sign In</button>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-text">
                <h2>The <span>Smart</span> Choice For <span>Future</span></h2>
                <p>Elearn is a global training provider based across the UK that
                    specialises in accredited and bespoke training courses.
                    We crush the...</p>
                <form class="form-input">
                    <img class="search-img" src="photo/hero/search.svg" alt="">
                    <input type="text" class="input-search" placeholder="Search for a location...">
                    <button class="btn-hero" type="submit">Continue</button>
                </form>
            </div>
            <div class="hero-img">
                <img src="photo/hero/OBJECTS.png" alt="">
            </div>
        </section>
    </main>
</body>
</html>
